type: object
properties:
  storage:
    type: object
    default: {}
    description: |
      Settings of the system object storage data plane: a Garage cluster on the
      control-plane nodes, backed by node-sticky local volumes.

      It runs three replicas with a replication factor of 3, independent of the
      control-plane node count, unless `singleReplica` reduces it to one. There is
      no custom resource for it — the module runs exactly one data plane, and
      these are all its knobs.
    properties:
      recreateConfirmation:
        type: string
        description: |
          Acknowledges that changing `singleReplica` destroys everything stored
          in the system object storage.

          Required in the same change that flips `singleReplica`, and ignored
          otherwise. Set it to
          `i-understand-this-destroys-all-system-object-data`.

          Without it the controller refuses to touch the data plane: it keeps
          running with the replica count it has, and every `SystemBucket` reports
          the refusal in its `StorageReady` condition, naming this setting.
          Nothing is destroyed and nothing is blocked — the edit itself is
          accepted, it simply is not acted upon.

          Remove it once the change is applied: left in place it would
          authorise the next flip as well, and the point of it is to be a
          deliberate gesture per change rather than a setting.
      singleReplica:
        type: boolean
        default: false
        description: |
          Run the system object storage as a single Garage replica
          (`replication_factor: 1`) instead of the default three.

          The replica is placed on one control-plane node and **never migrates
          between masters**: its data lives on that node's local volume and there
          is no second copy to re-replicate from. If that node is removed or
          stays down, the system storage is unavailable until it returns (the data
          on its disk is not touched), and the controller will not move the
          replica for you.

          Use it to cut the footprint of the system storage on small or
          non-production installations. Do not use it where the platform data in
          the system buckets must survive the loss of a control-plane node.

          > **Toggling this setting recreates the data plane and DESTROYS
          > everything stored in it.** Garage cannot change its replication factor
          > on a live cluster, so the controller tears the data plane down
          > (StatefulSet, volumes, node identities) and rebuilds it empty on fresh
          > directories, in both directions (on and off). Buckets are recreated and
          > access keys are re-issued automatically, but the objects are gone —
          > back up anything you need first. The previous data directories are left
          > on the control-plane nodes under
          > `/var/lib/deckhouse/system-s3/garage/system` and can be removed
          > manually once you no longer need them.
      sizePerNode:
        type: string
        default: 10Gi
        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
        description: |
          Capacity of the node-sticky local volume provisioned per replica, as a
          Kubernetes quantity.

          The volume is a `hostPath` directory on the control-plane node, so the
          value is nominal: Kubernetes does not enforce it, and the replica can
          use as much as the node's filesystem has. Raising it after the fact does
          not move data — it only changes the size the new PersistentVolumes of the
          pool are created with.
  logLevel:
    type: string
    enum:
      - ERROR
      - WARN
      - INFO
      - DEBUG
      - TRACE
    description: Module log verbosity level.
    default: INFO
  controller:
    type: object
    default: {}
    description: |
      Settings of the system-s3-controller (the reconciler for
      SystemBucket resources and for the storage data plane).
    properties:
      resourcesManagement:
        description: |
          system-s3-controller resources management options.
        default: {}
        x-examples:
          - mode: VPA
            vpa:
              mode: Auto
              cpu: { min: 50m, max: 200m, limitRatio: 1.5 }
              memory: { min: 64Mi, max: 256Mi, limitRatio: 1.5 }
        properties:
          mode:
            type: string
            description: |
              The mode for managing resource requests. Classical `Static` requests/limits or `VPA`.
            enum: [VPA, Static]
            default: VPA
          vpa:
            type: object
            default: {}
            description: |
              Parameters of the VPA mode.
            properties:
              mode:
                type: string
                description: |
                  The VPA usage mode.
                enum: [Initial, Auto]
                default: Auto
              cpu:
                type: object
                default: {}
                description: |
                  CPU-related parameters.
                properties:
                  max:
                    description: |
                      Maximum allowed CPU requests.
                    default: 200m
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  min:
                    description: |
                      Minimum allowed CPU requests.
                    default: 50m
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  limitRatio:
                    type: number
                    description: |
                      Coefficient used to calculate the initial CPU limit from the request.

                      VPA preserves the resulting limits/requests ratio during further resource tuning.
              memory:
                type: object
                default: {}
                description: |
                  Memory-related parameters.
                properties:
                  max:
                    description: |
                      Maximum allowed memory requests.
                    default: 256Mi
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
                  min:
                    description: |
                      Minimum allowed memory requests.
                    default: 64Mi
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
                  limitRatio:
                    type: number
                    description: |
                      Coefficient used to calculate the initial memory limit from the request.

                      VPA preserves the resulting limits/requests ratio during further resource tuning.
          static:
            type: object
            description: |
              Static resource management settings.
            properties:
              requests:
                type: object
                description: |
                  Resource requests for the controller pod.
                properties:
                  cpu:
                    description: |
                      CPU request.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  memory:
                    description: |
                      Memory request.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
              limits:
                type: object
                description: |
                  Resource limits for the controller pod.
                properties:
                  cpu:
                    description: |
                      CPU limit.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  memory:
                    description: |
                      Memory limit.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
