x-config-version: 3
type: object
properties:
  highAvailability:
    type: boolean
    x-examples: [true, false]
    description: |
      Overrides the platform's high-availability mode for the system object
      storage.

      Left unset it follows `global.highAvailability`, and with that unset too,
      whether the control plane itself is highly available (more than one
      master).

      The mode decides the shape of the data plane: highly available means three
      Garage replicas with a replication factor of 3, and not highly available
      means a single replica with a replication factor of 1 — a third of the
      footprint, no redundancy, and the store is unavailable while its pod is
      down.

      Left unset, the mode is DERIVED from the cluster, and one direction of that
      is not acted on: a control plane that loses masters starts reading as not
      highly available, and the store keeps its three replicas anyway. Dropping to
      one is a loss of redundancy, and losing masters is not a request for it — it
      happens when the cluster can least afford it. The store moves to a single
      replica only when this setting says so out loud. The other direction needs
      no asking: masters coming back grows the store on its own.

      Changing the mode on an installation that already holds data is done on
      the same Garage cluster, on the same volumes. Garage cannot change its
      replication factor while it runs, so the module stops the data plane,
      removes the saved cluster layout and starts it again with the other
      replica count; no objects are copied and no second cluster is built.

      Going from one replica to three, the store is unavailable from the stop
      until the three replicas are up — usually under a minute, longer if the new
      volumes are slow to be provisioned. The new replicas are filled in the
      background while the store serves. Going from three to one, writes are
      refused first, until every replica holds everything (reads keep working);
      if that does not happen within 10 minutes, writes are given back and the
      change is tried again later. Then the store is unavailable for about a
      minute while it restarts on one replica, and the volumes of the two
      replicas that are gone are released.

      The endpoint keeps its address and every key keeps working, so no
      credentials `Secret` has to be re-read. Progress is reported in the
      `ReplicationReady` condition of `Module/system-s3`.
  storageClass:
    type: string
    x-examples: ["ceph-csi-rbd", "localpath-system"]
    description: |
      StorageClass the system object storage orders its volumes from — one
      PersistentVolumeClaim per Garage replica.

      Left unset it follows `global.modules.storageClass`, and with that unset
      too, the cluster's default StorageClass.

      A StorageClass is required: the module has no storage of its own to fall
      back to, so an installation where none of the three resolves brings up no
      data plane at all and says so in the `StorageReady` condition of
      `Module/system-s3`.

      Which class to choose is a durability decision. A class whose volumes are
      pinned to a node (a local class) ties each replica's data to the node it
      first landed on: the replica's copy is lost with that node and is rebuilt
      from the others, which the highly available mode survives and the single
      replica does not. A class whose volumes follow the pod (a network class)
      keeps the data across a node's replacement.

      On a local class, where the replicas run decides where their data lives.
      They run on nodes with the `node-role.deckhouse.io/system-s3` role if the
      cluster has any, on system nodes otherwise, and on the masters when it has
      neither. Giving the role to a NodeGroup made for the store, with
      disks sized for it, keeps the data off nodes that a NodeGroup grows, shrinks
      and replaces for other workloads — each such replacement costs a replica its
      copy on a local class.

      Changing it on an installation that already holds data is performed as a
      migration, because the volumes of a running store cannot be re-ordered from
      another class in place: the module builds a second Garage cluster on the
      new class, copies the objects into it and moves the endpoint onto it. Both
      clusters exist at once for the length of it, so the storage it needs is up
      to twice the usual. What consumers see is a few minutes, during the switch
      itself, in which writes are refused. In the highly available mode the
      store keeps serving reads, though a read can stall for up to about a
      minute while a source replica restarts; a single-replica store is
      restarted once during the switch, and reads are unavailable for that
      minute or two. The cluster
      migrated away from is kept read-only only until every replica of the new
      one holds every block, and is then removed. Putting the
      setting back before the switch happens calls the migration off and removes
      the half-built cluster. A change of `highAvailability` made together with
      it is carried out by the same migration.
  logLevel:
    type: string
    enum:
      - ERROR
      - WARN
      - INFO
      - DEBUG
      - TRACE
    description: Module log verbosity level.
    default: INFO
  controller:
    type: object
    default: {}
    description: |
      Settings of the system-s3-controller (the reconciler for
      SystemBucket resources and for the storage data plane).
    properties:
      resourcesManagement:
        description: |
          system-s3-controller resources management options.
        default: {}
        x-examples:
          - mode: VPA
            vpa:
              mode: Auto
              cpu: { min: 50m, max: 200m, limitRatio: 1.5 }
              memory: { min: 64Mi, max: 256Mi, limitRatio: 1.5 }
        properties:
          mode:
            type: string
            description: |
              The mode for managing resource requests. Classical `Static` requests/limits or `VPA`.
            enum: [VPA, Static]
            default: VPA
          vpa:
            type: object
            default: {}
            description: |
              Parameters of the VPA mode.
            properties:
              mode:
                type: string
                description: |
                  The VPA usage mode.
                enum: [Initial, Auto]
                default: Auto
              cpu:
                type: object
                default: {}
                description: |
                  CPU-related parameters.
                properties:
                  max:
                    description: |
                      Maximum allowed CPU requests.
                    default: 200m
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  min:
                    description: |
                      Minimum allowed CPU requests.
                    default: 50m
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  limitRatio:
                    type: number
                    description: |
                      Coefficient used to calculate the initial CPU limit from the request.

                      VPA preserves the resulting limits/requests ratio during further resource tuning.
              memory:
                type: object
                default: {}
                description: |
                  Memory-related parameters.
                properties:
                  max:
                    description: |
                      Maximum allowed memory requests.
                    default: 256Mi
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
                  min:
                    description: |
                      Minimum allowed memory requests.
                    default: 64Mi
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
                  limitRatio:
                    type: number
                    description: |
                      Coefficient used to calculate the initial memory limit from the request.

                      VPA preserves the resulting limits/requests ratio during further resource tuning.
          static:
            type: object
            description: |
              Static resource management settings.
            properties:
              requests:
                type: object
                description: |
                  Resource requests for the controller pod.
                properties:
                  cpu:
                    description: |
                      CPU request.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  memory:
                    description: |
                      Memory request.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
              limits:
                type: object
                description: |
                  Resource limits for the controller pod.
                properties:
                  cpu:
                    description: |
                      CPU limit.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+m?$'
                      - type: number
                  memory:
                    description: |
                      Memory limit.
                    oneOf:
                      - type: string
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                      - type: number
