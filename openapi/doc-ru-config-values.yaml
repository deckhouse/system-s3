properties:
  highAvailability:
    description: |
      Переопределяет режим отказоустойчивости платформы для системного
      объектного хранилища.

      Если параметр не задан, берётся `global.highAvailability`, а при его
      отсутствии — отказоустойчивость самого control plane (больше одного
      мастера).

      Режим задаёт форму data plane: отказоустойчивый — это три реплики Garage с
      фактором репликации 3, неотказоустойчивый — одна реплика с фактором 1,
      то есть треть потребления, отсутствие избыточности и недоступность
      хранилища, пока под не работает.

      Если параметр не задан, режим **выводится** из кластера — и одно из
      направлений этого вывода не исполняется: control plane, потерявший мастера,
      начинает читаться как неотказоустойчивый, а хранилище всё равно остаётся с
      тремя репликами. Переход на одну реплику — это потеря избыточности, а потеря
      мастеров не является просьбой о ней: она случается тогда, когда кластер
      меньше всего может себе это позволить. Хранилище уменьшается до одной
      реплики, только если это прямо написано в настройке. Обратное направление
      спрашивать не нужно: вернувшиеся мастера наращивают хранилище сами.

      Смена режима на инсталляции, где уже есть данные, выполняется миграцией,
      потому что Garage не умеет менять фактор репликации на живом кластере:
      модуль поднимает рядом второй кластер Garage, копирует в него объекты и
      переводит на него эндпоинт. На это время оба кластера существуют
      одновременно, поэтому места требуется до двух раз больше обычного.
      Потребители видят только несколько минут на самом переключении, когда
      запись отклоняется, а чтение продолжает работать: адрес эндпоинта прежний
      и все ключи продолжают действовать, перечитывать `Secret` с кредами не
      нужно. Ход миграции пишется в условие `StorageReady` каждого
      `SystemBucket`, а кластер, с которого ушли, остаётся ещё 24 часа в режиме
      только для чтения.
  storageClass:
    description: |
      StorageClass, из которого системное объектное хранилище заказывает тома —
      по одному PersistentVolumeClaim на реплику Garage.

      Если параметр не задан, берётся `global.modules.storageClass`, а при его
      отсутствии — StorageClass по умолчанию в кластере.

      StorageClass обязателен: своего хранилища у модуля нет, поэтому на
      инсталляции, где не нашлось ни одного из трёх, data plane не
      разворачивается, и каждый `SystemBucket` сообщает об этом в условии
      `StorageReady`.

      Выбор класса — это решение о сохранности данных. Класс, тома которого
      привязаны к узлу (локальный), привязывает к узлу и копию данных реплики:
      с потерей узла копия теряется и восстанавливается с остальных — что
      переживает отказоустойчивый режим и не переживает одиночная реплика. Класс,
      том которого едет за подом (сетевой), сохраняет данные при замене узла.

      Смена класса на инсталляции, где уже есть данные, выполняется той же
      миграцией, что и смена `highAvailability`, потому что тома работающего
      хранилища нельзя перезаказать из другого класса на месте. Если вернуть
      настройку назад до переключения, миграция отменяется, а недостроенный
      кластер удаляется.
  logLevel:
    description: Уровень логирования модуля.
  controller:
    description: |
      Настройки system-s3-controller — контроллера, который сводит ресурсы
      SystemBucket и data plane хранилища.
    properties:
      resourcesManagement:
        description: |
          Управление ресурсами system-s3-controller.
        properties:
          mode:
            description: |
              Режим управления запросами ресурсов: классические `Static`
              requests/limits или `VPA`.
          vpa:
            description: |
              Параметры режима VPA.
            properties:
              mode:
                description: |
                  Режим работы VPA.
              cpu:
                description: |
                  Параметры, относящиеся к CPU.
                properties:
                  max:
                    description: |
                      Максимально допустимый запрос CPU.
                  min:
                    description: |
                      Минимально допустимый запрос CPU.
                  limitRatio:
                    description: |
                      Коэффициент, по которому из запроса вычисляется начальный
                      лимит CPU.

                      Полученное соотношение limits/requests VPA сохраняет и при
                      дальнейшей подстройке ресурсов.
              memory:
                description: |
                  Параметры, относящиеся к памяти.
                properties:
                  max:
                    description: |
                      Максимально допустимый запрос памяти.
                  min:
                    description: |
                      Минимально допустимый запрос памяти.
                  limitRatio:
                    description: |
                      Коэффициент, по которому из запроса вычисляется начальный
                      лимит памяти.

                      Полученное соотношение limits/requests VPA сохраняет и при
                      дальнейшей подстройке ресурсов.
          static:
            description: |
              Настройки статического управления ресурсами.
            properties:
              requests:
                description: |
                  Запросы ресурсов для пода контроллера.
                properties:
                  cpu:
                    description: |
                      Запрос CPU.
                  memory:
                    description: |
                      Запрос памяти.
              limits:
                description: |
                  Лимиты ресурсов для пода контроллера.
                properties:
                  cpu:
                    description: |
                      Лимит CPU.
                  memory:
                    description: |
                      Лимит памяти.
