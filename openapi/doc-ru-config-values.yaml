properties:
  storage:
    description: |
      Настройки data plane системного объектного хранилища: кластер Garage на
      control-plane узлах поверх локальных томов, привязанных к узлам.

      Работает в трёх репликах с фактором репликации 3 независимо от числа
      control-plane узлов, если параметр `singleReplica` не сводит его к одной
      реплике. Отдельного CR у хранилища нет — модуль поднимает ровно один
      data plane, и это все его настройки.
    properties:
      recreateConfirmation:
        description: |
          Подтверждает, что смена `singleReplica` уничтожит всё, что лежит в
          системном объектном хранилище.

          Требуется в том же изменении, что переключает `singleReplica`, и
          игнорируется в остальных случаях. Значение —
          `i-understand-this-destroys-all-system-object-data`.

          Удалите его после применения: оставленное, оно разрешит и следующее
          переключение, а смысл его в том, чтобы быть осознанным жестом на
          каждое изменение, а не настройкой.

      singleReplica:
        description: |
          Запускать системное хранилище в одной реплике Garage
          (`replication_factor: 1`) вместо трёх по умолчанию.

          Реплика размещается на одном control-plane узле и **никогда не
          переезжает между мастерами**: её данные лежат на локальном томе этого
          узла, а дореплицироваться не с чего — второй копии нет. Если узел
          выведен или недоступен, системное хранилище недоступно до его
          возвращения (данные на его диске не затрагиваются), и контроллер не
          будет переносить реплику.

          Режим нужен, чтобы уменьшить потребление ресурсов системным хранилищем
          на небольших и непродуктивных инсталляциях. Не используйте его там, где
          данные платформы в системных бакетах должны переживать потерю
          control-plane узла.

          > **Включение и выключение параметра пересоздаёт data plane и
          > УНИЧТОЖАЕТ все хранящиеся в нём данные.** Garage не умеет менять
          > фактор репликации на живом кластере, поэтому контроллер сносит
          > data plane (StatefulSet, тома, идентичности нод) и поднимает его
          > пустым на новых каталогах — в обе стороны (и при включении, и при
          > выключении). Бакеты создаются заново, ключи доступа перевыпускаются
          > автоматически, но объекты теряются: сохраните нужные данные заранее.
          > Каталоги предыдущего кластера остаются на control-plane узлах в
          > `/var/lib/deckhouse/system-s3/garage/system` и могут быть
          > удалены вручную, когда перестанут быть нужны.
      sizePerNode:
        description: |
          Размер локального тома, создаваемого для каждой реплики, в формате
          Kubernetes quantity.

          Том — это каталог `hostPath` на control-plane узле, поэтому значение
          номинальное: Kubernetes его не ограничивает, и реплика может занять
          столько, сколько есть на файловой системе узла. Увеличение параметра
          уже работающему хранилищу данные не переносит — меняется только размер,
          с которым создаются новые PersistentVolume пула.
  logLevel:
    description: Уровень логирования модуля.
