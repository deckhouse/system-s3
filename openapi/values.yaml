x-extend:
  schema: config-values.yaml
type: object
properties:
  namespace:
    type: string
    default: d8-system-s3
  registry:
    type: object
    description: "System field, overwritten by Deckhouse. Don't use"
  internal:
    type: object
    default: {}
    properties:
      effectiveStorageClass:
        type: string
        x-examples: ["ceph-csi-rbd"]
        description: |
          The StorageClass the data plane's volumes are ordered from, resolved by
          the storage-class hook: the module's own setting, then
          global.modules.storageClass, then the cluster's default StorageClass.

          Empty when none of the three resolves. The chart still renders — the
          controller is what reports the missing class, on every SystemBucket —
          because a chart that failed to render would take the whole module down
          with a Helm error instead of one condition saying what to set.
      customWebhookCert:
        type: object
        default: {}
        description: |
          The certificate the credentials endpoint serves, issued by the
          020-webhook-certs hook and rendered into the Secret webhooks-https-certs.

          The name is left over from the admission webhook the controller pod used
          to run, which served the same certificate. It is kept, with the Secret's
          name, because renaming either would reissue the certificate on every
          cluster and gain nothing.
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      customWebhookCA:
        type: object
        default: {}
        description: |
          The CA the credentials-endpoint certificate (customWebhookCert) is
          signed by, kept apart from the certificate itself.

          It is separate so that the CA can be given a common name of its own. A
          CA sharing the certificate's CN produces a chain that Go accepts and
          OpenSSL refuses — the issuer name equals the subject name, so openssl
          calls the certificate self-issued and stops at depth 0. Consumers
          verifying the credentials endpoint with anything but Go would fail.

          It is also rendered into the Secret system-s3-ca, from which the
          certificate hooks restore it when Deckhouse starts with empty values;
          otherwise every start of Deckhouse would issue a new CA.
        x-required-for-helm:
          - crt
          - key
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      garageCert:
        type: object
        default: {}
        description: |
          The certificate the data plane's TLS terminator serves, issued by the
          021-garage-certs hook from the same CA as customWebhookCert.

          Garage has no TLS of its own; a sidecar in every Garage pod terminates it
          with this certificate, and the controller, the migration Job and every
          consumer verify it against the CA. A key of its own rather than the
          credentials endpoint's certificate: the Garage pods hold it, and a
          compromised data-plane pod must not be able to impersonate the
          credentials endpoint.
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      stsServiceName:
        type: string
        default: system-s3-sts
        description: |
          Name of the Service in front of the credentials endpoint. It is a value
          rather than a literal in the chart because the certificate's SANs are
          generated from the same name in hooks/go/consts — the two have to agree
          or every consumer fails TLS verification.
      stsPort:
        type: integer
        default: 8444
        description: |
          The port the controller serves the credentials endpoint on. Not 8443,
          because that was the port of the admission webhook container the
          controller Pod used to run in the same network namespace. Consumers
          reach the endpoint through its Service on 443, so the number is internal
          to the Pod and there is no reason to move it.
      controllerMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the kube-rbac-proxy publishes the controller metrics on. Reaching
          it requires "get" on deployments/prometheus-metrics for the controller; the
          controller itself keeps its metrics on 127.0.0.1.
      controllerMetricsPort:
        type: integer
        description: |
          The port the module controller serves its metrics on, bound on 127.0.0.1:
          the kube-rbac-proxy of the same pod is the only thing that reaches it. What
          is on it is what controller-runtime exports for every controller registered
          with the manager -- reconcile counts and durations, workqueue depth,
          client-go latency -- plus any metric the module declares of its own.
        default: 8080
