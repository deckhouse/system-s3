name: "system-s3"
stage: "Experimental"
subsystems:
  - storage
descriptions:
  en: "Provides the platform's system S3 object storage."
  ru: "Предоставляет системное объектное хранилище S3 для платформы."
requirements:
  deckhouse: ">= 1.72"
namespace: d8-system-s3
disable:
  confirmation: true
  message: |
    Attention!

    Disabling this module deletes the system object storage. The Garage data plane goes with the module namespace, and so do the claims of its volumes; the stored objects go with the volumes unless the StorageClass keeps released volumes (reclaimPolicy: Retain). Platform components that have a SystemBucket lose access to their data at once: the S3 endpoint and the credentials endpoint stop answering.

    Before disabling the module:

    - List the buckets with `kubectl get systembuckets.storage.deckhouse.io -A` (short name: `sb`). Every component listed keeps data in the system object storage.
    - Make sure none of them still needs it: disable those components or delete their SystemBucket resources first.
    - If the data has to be kept, copy it out with an S3 client first. A re-enabled module does not reattach retained volumes: it starts with an empty store.

    SystemBucket resources are not deleted with the module. They stay, with their connection ConfigMaps, and when the module is enabled again their buckets are created again — empty.
