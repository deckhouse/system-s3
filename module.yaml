name: "system-s3"
stage: "Experimental"
subsystems:
  - storage
descriptions:
  en: "Provides the platform's system S3 object storage."
  ru: "Предоставляет системное объектное хранилище S3 для платформы."
requirements:
  deckhouse: ">= 1.72"
namespace: d8-system-s3
disable:
  confirmation: true
  message: |
    Attention!

    Disabling this module stops the system object storage; it does not delete it. The Garage data plane is scaled to zero and stays in the d8-system-s3 namespace with its volumes and the Secrets that make them a cluster again. Platform components that have a SystemBucket lose access at once: the S3 endpoint and the credentials endpoint stop answering until the module is enabled again, and then the store comes back with its data.

    Before disabling the module:

    - List the buckets with `kubectl get systembuckets.storage.deckhouse.io -A` (short name: `sb`). Every component listed keeps data in the system object storage and stops working while the module is disabled.
    - Disable those components, or accept that they are down until the module is back.

    SystemBucket resources are not deleted with the module. They stay, with their connection ConfigMaps.

    The data is deleted only by an explicit step: with the module disabled, delete the namespace (`kubectl delete namespace d8-system-s3`). The volumes then follow the reclaim policy of their StorageClass. Do this, too, before destroying the cluster with dhctl.
