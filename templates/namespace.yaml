---
apiVersion: v1
kind: Namespace
metadata:
  name: d8-{{ .Chart.Name }}
  {{- /*
    The rules-watcher label is what makes Prometheus read this namespace's
    PrometheusRules at all. Without it the module's alerts render into the
    cluster and nobody watches them, which looks exactly like having alerts.

    The monitor-watcher label does the same for the PodMonitor of the data plane
    (templates/garage-podmonitor.yaml). That monitor lives here rather than in
    d8-monitoring because its bearer token is a Secret the controller writes, and
    Prometheus reads a monitor's token from the monitor's own namespace.
  */ -}}
  {{- include "helm_lib_module_labels" (list . (dict
    "prometheus.deckhouse.io/rules-watcher-enabled" "true"
    "prometheus.deckhouse.io/monitor-watcher-enabled" "true"
  )) | nindent 2 }}
  {{- /*
    Kept when the module is disabled. The namespace holds the data plane — the
    Garage StatefulSets, their PersistentVolumeClaims and the Secrets with the
    cluster's RPC secret, admin token and node identities, all created by the
    controller rather than by this chart — and a namespace deleted with the
    release took every platform component's system bucket with it. Disabling the
    module removes what the chart rendered and stops Garage (the
    050-stop-data-plane-on-module-delete hook); enabling it again finds the store
    as it was. Deleting the data is a separate, explicit step: deleting this
    namespace once the module is disabled. The heritage label the line above
    puts here would refuse that to anybody but Deckhouse, so the
    051-release-heritage hook takes it off on the way out and puts it back when
    the module is enabled again.
  */}}
  annotations:
    helm.sh/resource-policy: keep
