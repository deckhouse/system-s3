{{- /*
  The module's common CA, key included: the CA that signs the webhook and
  credentials-endpoint certificate and the data plane's (hooks/go/020-webhook-certs,
  hooks/go/021-garage-certs).

  It is rendered from the values the certificate hooks keep it in, and read back
  by them when Deckhouse starts with empty values (see hooks/go/persistedca).
  Without it every start of Deckhouse issued a new CA, and every consumer that
  trusts the module's CA stopped trusting both endpoints.

  The values hold the CA as module-sdk marshals it, the PEM already base64-encoded,
  so it goes into data as it is.
*/ -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: system-s3-ca
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "system-s3")) | nindent 2 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.systemS3.internal.customWebhookCA.crt | quote }}
  tls.key: {{ .Values.systemS3.internal.customWebhookCA.key | quote }}
