{{- /*
  The module's common CA, key included: the CA that signs the credentials
  endpoint's certificate and the data plane's (hooks/go/020-webhook-certs,
  hooks/go/021-garage-certs).

  It is rendered from the values the certificate hooks keep it in, and read back
  by them when Deckhouse starts with empty values (see hooks/go/persistedca).
  Without it every start of Deckhouse issued a new CA, and every consumer that
  trusts the module's CA stopped trusting both endpoints.
*/ -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: system-s3-ca
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "system-s3")) | nindent 2 }}
  {{- /*
    Kept when the module is disabled, like the namespace (templates/namespace.yaml).
    The consumers' connection ConfigMaps outlive the module and carry this CA; a
    Secret deleted with the release let the module come back with a new one, and
    every consumer stopped trusting both endpoints.
  */}}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.systemS3.internal.customWebhookCA.crt | b64enc | quote }}
  tls.key: {{ .Values.systemS3.internal.customWebhookCA.key | b64enc | quote }}
