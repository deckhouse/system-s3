{{- if eq (include "system-s3.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: system-s3
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.system-s3.view"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-system-s3
  name: d8:system-capability:system-s3:view
  annotations:
    en.meta.deckhouse.io/title: "Module system-s3: view resources"
    ru.meta.deckhouse.io/title: "Модуль system-s3: просмотр ресурсов"
    en.meta.deckhouse.io/description: "Read-only access to the SystemBucket resources of the system-s3 module in all namespaces."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к ресурсам SystemBucket модуля system-s3 во всех пространствах имён."
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - systembuckets
    verbs:
      - get
      - list
      - watch
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: system-s3
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-system-s3
  name: d8:manage:permission:module:system-s3:view
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - systembuckets
    verbs:
      - get
      - list
      - watch
{{- end }}
