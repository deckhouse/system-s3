{{- if eq (include "system-s3.rbacv2_new_scheme" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:system-s3:view
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/aggregate-to-storage-as" "viewer" "rbac.deckhouse.io/capability" "system-capability.system-s3.view" "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/namespace" "d8-system-s3" "rbac.deckhouse.io/scope" "system")) | nindent 2 }}
  annotations:
    en.meta.deckhouse.io/description: "Read-only access to the system-s3 module configuration."
    en.meta.deckhouse.io/title: "Module system-s3: view configuration"
    ru.meta.deckhouse.io/description: "Доступ только на чтение к конфигурации модуля system-s3."
    ru.meta.deckhouse.io/title: "Модуль system-s3: просмотр конфигурации"
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - moduleconfigs
  resourceNames:
  - system-s3
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.deckhouse.io
  resources:
  - systembuckets
  verbs:
  - get
  - list
  - watch
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: system-s3
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-system-s3
  name: d8:manage:permission:module:system-s3:view
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - systembuckets
    verbs:
      - get
      - list
      - watch
{{- end }}
