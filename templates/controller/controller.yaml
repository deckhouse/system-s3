{{- /* Webhook TLS Certs Secret */ -}}
{{- $secretConfig := dict
  "valuesKey" "systemS3"
  "webhookCertPath" "internal.customWebhookCert"
}}
{{ include "helm_lib_module_webhook_certs_secret" (list . $secretConfig) }}

{{- /* Controller Deployment + VPA + PDB */ -}}
{{- /*
  helm_lib_module_controller_manifests already injects LOG_LEVEL (from
  .Values.systemS3.logLevel via helm_lib_module_controller_log_level) and
  CONTROLLER_NAMESPACE (valueFrom fieldRef metadata.namespace).

  The data plane has no custom resource, so its settings reach the controller as
  environment: HIGH_AVAILABILITY and STORAGE_CLASS are what the ObjectStore CR
  used to carry in the user-facing module. How big the store is does not appear
  here at all: it is the sum of the SystemBucket sizes, which the controller reads
  from the cluster.

  HIGH_AVAILABILITY is resolved here rather than in the controller, because the
  chain it comes from is a platform convention and lib-helm already owns it:
  the module setting, then global.highAvailability, then whether the control
  plane itself is highly available. The controller sees the answer, not the
  chain.

  The controller workload itself follows control-plane HA, independently of the
  data-plane setting. In particular, a cluster with one control-plane node may
  still run three Garage replicas on workers. Feeding systemS3.highAvailability
  into helm_lib_module_controller_manifests would put required controller
  anti-affinity on that single node and deadlock its rollout.

  HIGH_AVAILABILITY_EXPLICIT is the one thing about that chain the controller
  does have to know: whether the answer was WRITTEN by somebody or DERIVED from
  the shape of the control plane. The derived value changes on its own when
  masters are lost, and "the cluster is down to one master" must not be read as
  "please move the system storage to a single replica" — that is a loss of
  redundancy nobody asked for, performed at the worst possible moment. The
  controller refuses that direction unless the setting is explicit; the other
  direction (masters came back, the mode reads as highly available again) is
  safe and runs on its own.

  STORAGE_CLASS is the same shape for the same reason, resolved by the
  storage-class hook (module setting, then global.modules.storageClass, then the
  cluster default) into internal.effectiveStorageClass. It can legitimately be
  empty — a cluster with no StorageClass at all — and the chart renders it empty
  rather than failing: the controller is what reports the missing class, on every
  SystemBucket, and a Helm error would take the module down instead of saying
  what to set.

  DATA_PLANE_NODE_SELECTOR and DATA_PLANE_TOLERATIONS are where the Garage pods
  may run: nodes with the module's own role (node-role.deckhouse.io/system-s3) if
  the cluster has any, system nodes if it has those instead (the platform's
  "system" strategy), the masters otherwise (the "master" strategy, with their
  taints tolerated). The controller builds
  the data plane, but the chart has the per-role node counts from discovery and
  lib-helm owns the rule, so the chart renders the answer as JSON and the
  controller applies it as it is.

  CONTROLLER_IMAGE is this same image. The object copier of a migration between
  two Garage clusters is this binary with a different argument, run as a Job, and
  a running pod cannot find out the reference it was pulled from — so the chart,
  which does know, says it.

  The credentials endpoint (STS_*) is served by the controller container itself,
  because it needs what the controller already has: the Garage driver, the
  Kubernetes clients, and the store description. It reuses the module's webhook
  certificate — mounted here into the controller container as well — since that
  certificate is issued for names in this namespace and the hook adds the
  endpoint's Service name to its SANs. A second PKI for a second listener in the
  same Pod would be two things to rotate instead of one.

  controllerMetricsPort is the loopback port the manager serves /metrics on; the
  port that is actually published belongs to the kube-rbac-proxy sidecar
  (controllerMetricsProxyPort) and reaches the ServiceMonitor through
  helm_lib_module_webhook_service, which is the only Service this chart has.
*/ -}}
{{- $dataPlaneNodeSelector := (include "helm_lib_node_selector" (tuple . "system") | fromYaml).nodeSelector | default dict -}}
{{- $dataPlaneTolerations := (include "helm_lib_tolerations" (tuple . "system") | fromYaml).tolerations | default list -}}
{{- if not $dataPlaneNodeSelector -}}
  {{- $dataPlaneNodeSelector = (include "helm_lib_node_selector" (tuple . "master") | fromYaml).nodeSelector | default dict -}}
  {{- $dataPlaneTolerations = concat $dataPlaneTolerations (list (dict "key" "node-role.kubernetes.io/master") (dict "key" "node-role.kubernetes.io/control-plane")) -}}
{{- end -}}
{{- $controllerContext := deepCopy . -}}
{{- $_ := unset $controllerContext.Values.systemS3 "highAvailability" -}}
{{- $_ := unset $controllerContext.Values.global "highAvailability" -}}
{{- $config := dict
  "valuesKey" "systemS3"
  "onMasterNode" true
  "podSecurityContext" "deckhouse"
  "webhookEnabled" true
  "webhookCertPath" "internal.customWebhookCert"
  "controllerMetricsPort" (int .Values.systemS3.internal.controllerMetricsPort)
  "controllerMetricsProxyPort" (int .Values.systemS3.internal.controllerMetricsProxyPort)
  "additionalControllerEnvs" (list
    (dict "name" "GARAGE_IMAGE" "value" (include "helm_lib_module_image" (list . "garage")))
    (dict "name" "CONTROLLER_IMAGE" "value" (include "helm_lib_module_image" (list . "controller")))
    (dict "name" "CLUSTER_DOMAIN" "value" .Values.global.discovery.clusterDomain)
    (dict "name" "HIGH_AVAILABILITY" "value" (include "helm_lib_is_ha_to_value" (list . "true" "false")))
    (dict "name" "HIGH_AVAILABILITY_EXPLICIT" "value" (ternary "true" "false" (or (hasKey .Values.systemS3 "highAvailability") (hasKey .Values.global "highAvailability"))))
    (dict "name" "STORAGE_CLASS" "value" (.Values.systemS3.internal.effectiveStorageClass | default ""))
    (dict "name" "STS_BIND_ADDRESS" "value" (printf ":%d" (int .Values.systemS3.internal.stsPort)))
    (dict "name" "STS_TLS_CERT_FILE" "value" "/etc/sts-certs/tls.crt")
    (dict "name" "STS_TLS_KEY_FILE" "value" "/etc/sts-certs/tls.key")
    (dict "name" "STS_ENDPOINT" "value" (printf "https://%s.d8-%s.svc.%s" .Values.systemS3.internal.stsServiceName .Chart.Name .Values.global.discovery.clusterDomain))
    (dict "name" "STS_CERT_SECRET" "value" "webhooks-https-certs")
    (dict "name" "GARAGE_TLS_SECRET" "value" "garage-tls")
    (dict "name" "GARAGE_TLS_CA_FILE" "value" "/etc/garage-tls/ca.crt")
    (dict "name" "DATA_PLANE_NODE_SELECTOR" "value" ($dataPlaneNodeSelector | toJson))
    (dict "name" "DATA_PLANE_TOLERATIONS" "value" ($dataPlaneTolerations | toJson))
  )
  "additionalControllerVolumeMounts" (list
    (dict "name" "webhook-certs" "mountPath" "/etc/sts-certs" "readOnly" true)
    (dict "name" "garage-tls-ca" "mountPath" "/etc/garage-tls" "readOnly" true)
  )
  "additionalVolumes" (list
    (dict "name" "garage-tls-ca" "secret" (dict "secretName" "garage-tls" "items" (list (dict "key" "ca.crt" "path" "ca.crt"))))
  )
}}
{{ include "helm_lib_module_controller_manifests" (list $controllerContext $config) }}

{{- /*
  Webhook Service. It carries the metrics port too: the controller and the
  webhook share a pod, so one Service can front both, and a ServiceMonitor needs
  a Service to select.
*/ -}}
{{- $serviceConfig := dict
  "additionalPorts" (list (dict
    "name" "https-metrics"
    "port" (int .Values.systemS3.internal.controllerMetricsProxyPort)
    "targetPort" "https-metrics"
  ))
}}
{{ include "helm_lib_module_webhook_service" (list . $serviceConfig) }}

{{- /*
  ValidatingWebhookConfiguration for SystemBucket (namespaced).

  The scope must match the CRD: a rule scoped to Cluster never matches a
  namespaced resource, so the API server would silently stop calling the webhook
  and every SystemBucket — one in a tenant namespace included — would be
  admitted.

  failurePolicy is Fail on purpose. This webhook is the gate that keeps the
  platform's system storage out of tenant namespaces, and admitting writes while
  it is down would hand out system credentials on nobody's check. The controller
  re-checks the same label before issuing credentials, so the two together fail
  closed.
*/ -}}
{{- $systemBucketWebhookConfig := dict
  "name" "systembucket-validation"
  "webhookName" "systembucket-validation"
  "valuesKey" "systemS3"
  "path" "/systembucket-validate"
  "failurePolicy" "Fail"
  "rules" (list
    (dict
      "apiGroups" (list "storage.deckhouse.io")
      "apiVersions" (list "v1alpha1")
      "operations" (list "CREATE" "UPDATE")
      "resources" (list "systembuckets")
      "scope" "Namespaced"
    )
  )
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $systemBucketWebhookConfig) }}
