{{- /*
  RBAC for the system-s3-controller.

  The controller-runtime cache is cluster-scoped by default, so any namespaced
  resource the manager reads (Secret, ConfigMap, Service, ServiceAccount,
  StatefulSet) requires cluster-wide get/list/watch on the ServiceAccount.
  Mutation of the data-plane objects the Garage driver creates (ConfigMap,
  Service, ServiceAccount, StatefulSet) stays in the namespaced Role — they only
  ever live in d8-system-s3. Secrets are the exception: the SystemBucket
  reconciler writes the S3 credentials Secret into the consuming component's
  namespace, so secret write verbs are granted cluster-wide.

  The data plane additionally reads control-plane Nodes and manages a pool of
  cluster-scoped, node-pinned PersistentVolumes (its node-sticky local storage),
  so node read and persistentvolume verbs are granted cluster-wide too.

  Namespaces are read because the label heritage: deckhouse is what admits a
  SystemBucket: both the webhook and the reconciler check it, and neither can be
  told the answer by the object itself.

  The webhooks share the same ServiceAccount but exercise only the read verbs.

  tokenreviews and subjectaccessreviews are what the credentials endpoint is:
  it takes a caller's ServiceAccount token, asks the API server who that is, and
  asks it again whether they may use the bucket they named. Creating those two
  reviews is a delegation of authority, not authority of its own — the answer
  comes from the cluster's RBAC, and the endpoint cannot widen it. The same pair
  is already granted to the kube-rbac-proxy sidecar through d8:rbac-proxy for the
  metrics port; it is stated here explicitly rather than inherited, because a
  binding that exists for a different reason is a thing that can be removed for
  that reason.

  Cluster-wide Secret verbs carry no `delete`, deliberately: the credentials
  Secret has a controllerReference to its SystemBucket and is garbage-collected
  with it, and the module's own Secrets live in its namespace and are covered by
  the Role above. Nothing needs cluster-wide delete on Secrets, and the token
  that would carry it is mounted in the same Pod as the admission webhook.

  Cluster-wide `list` and `watch` on Secrets stay because RBAC cannot be narrowed
  by label — a Kubernetes limitation, not an oversight here. What is narrowed is
  the cache: the manager only watches Secrets carrying
  app.kubernetes.io/managed-by=system-s3, and only the Nodes and
  PersistentVolumes this module owns (see cmd/main.go).

  Note for future editors: do not place comments of ANY kind inside the argument
  expression of the function call below (the rule lists). A Helm/Go-template
  comment fails the parser with 'unexpected "{" in operand', and a YAML-style `#`
  comment fails it with 'unexpected "#" in operand' — the rule lists are one Go
  template action, not YAML, and it has no comment syntax. Keep rule-level
  commentary in this header block.
*/ -}}
{{- /*
  controllerMetricsProxyPort is not used as a port here. It is how
  helm_lib_module_controller_rbac learns that the pod carries a kube-rbac-proxy in
  front of the metrics, and therefore needs the ClusterRoleBinding to d8:rbac-proxy
  that lets the sidecar create the TokenReview and SubjectAccessReview every scrape
  is authorised with. Keep it in step with the value given to
  helm_lib_module_controller_manifests: without it the proxy fails closed on every
  scrape and the only symptom is up == 0 and a permanent TargetDown.
*/ -}}
{{- $rbacConfig := dict
  "controllerMetricsProxyPort" (int .Values.systemS3.internal.controllerMetricsProxyPort)
  "roleRules" (list
    (dict "apiGroups" (list "") "resources" (list "events") "verbs" (list "create" "list" "patch"))
    (dict "apiGroups" (list "") "resources" (list "pods") "verbs" (list "get" "list" "delete"))
    (dict "apiGroups" (list "") "resources" (list "pods/exec") "verbs" (list "create"))
    (dict "apiGroups" (list "") "resources" (list "persistentvolumeclaims") "verbs" (list "get" "list" "update" "patch" "delete"))
    (dict "apiGroups" (list "") "resources" (list "secrets" "configmaps" "services" "serviceaccounts") "verbs" (list "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "apps") "resources" (list "statefulsets") "verbs" (list "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "batch") "resources" (list "jobs") "verbs" (list "get" "list" "watch" "create" "delete"))
    (dict "apiGroups" (list "policy") "resources" (list "poddisruptionbudgets") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "coordination.k8s.io") "resources" (list "leases") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
  )
  "clusterRoleRules" (list
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "systembuckets" "systembuckets/status" "systembuckets/finalizers") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
    (dict "apiGroups" (list "") "resources" (list "secrets") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "") "resources" (list "configmaps") "verbs" (list "get" "list" "watch" "create" "update" "patch"))
    (dict "apiGroups" (list "") "resources" (list "services" "serviceaccounts") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "") "resources" (list "namespaces") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "") "resources" (list "nodes") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "") "resources" (list "persistentvolumes") "verbs" (list "get" "list" "watch" "create" "delete"))
    (dict "apiGroups" (list "apps") "resources" (list "statefulsets") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "policy") "resources" (list "poddisruptionbudgets") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "authentication.k8s.io") "resources" (list "tokenreviews") "verbs" (list "create"))
    (dict "apiGroups" (list "authorization.k8s.io") "resources" (list "subjectaccessreviews") "verbs" (list "create"))
  )
}}
{{ include "helm_lib_module_controller_rbac" (list . $rbacConfig) }}
