{{- /*
  Garage object storage server image.

  Garage is compiled from source (Rust) with the container-base `rust`/`cargo`
  toolchain installed via pm into the module's distroless build base — the same
  approach used by the log-shipper/vector Rust build in Deckhouse.

  The version is taken from oss.yaml (id: garage); keep it in sync with
  garageVersion in images/controller/internal/backend/garage.
*/ -}}
{{- $garageVersion := printf "v%s" (include "get_oss_version_by_id" (list "garage" $)) }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/src" }}
final: false

secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}

shell:
  install:
    - git clone --depth 1 --branch {{ $garageVersion }} $(cat /run/secrets/SOURCE_REPO)/deuxfleurs-org/garage.git /src
    - rm -rf /src/.git

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
    add: /src
    to: /src
    before: install

mount:
  - from: tmp_dir
    to: /root/.cargo/registry
  - from: tmp_dir
    to: /src/target

secrets:
- id: CARGO_PROXY
  value: {{ .CargoProxy }}

shell:
  install:
    # rust/cargo + a C toolchain (Garage bundles sqlite/lmdb and links ring,
    # all of which compile C sources via cc during the build).
    #
    # `curl` is here for cargo itself, not for the build: the cargo binary that
    # base-images v3.0.2 ships is linked against libcurl.so.4 (`readelf -d`),
    # where the v2.1.17 one had curl compiled in statically. The `cargo` package
    # carries only /usr/bin/cargo, so without `curl` in the image every cargo
    # invocation dies with "error while loading shared libraries: libcurl.so.4".
    - pm install rust cargo curl gcc gcc-devel glibc-devel libatomic-devel binutils make pkgconf protobuf linux-headers
    # The container-base `rust` package defaults to `clang` as the linker, which
    # is not installed; force the GNU toolchain (gcc, pulls glibc) via
    # RUSTFLAGS (rustc command line — outranks any baked-in default/config).
    - export CARGO_HOME=/root/.cargo CARGO_NET_GIT_FETCH_WITH_CLI=true CC=gcc RUSTFLAGS="-C linker=gcc"
    - mkdir -p "${CARGO_HOME}"
    - |
      export CARGO_PROXY=$(cat /run/secrets/CARGO_PROXY)
      if ! [[ "${CARGO_PROXY}" = "false" ]]; then
        echo '[source.crates-io]'                                >> "${CARGO_HOME}/config.toml"
        echo 'replace-with = "crates-io-mirror"'                 >> "${CARGO_HOME}/config.toml"
        echo '[registries.crates-io-mirror]'                     >> "${CARGO_HOME}/config.toml"
        echo 'index = "sparse+http://'"${CARGO_PROXY}"'/index/"' >> "${CARGO_HOME}/config.toml"
      fi
    - cd /src
    - cargo build --release --bin garage
    - cp /src/target/release/garage /garage
    - strip /garage
    - chmod 0755 /garage

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-runtime-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
shell:
  # Garage is a dynamically-linked glibc binary (x86_64-unknown-linux-gnu); the
  # distroless base has no libc, so ship the glibc runtime (loader + core libs)
  # and libgcc_s. Without this `/garage` fails with "no such file or directory".
  setup:
    # coreutils is not decoration: base64 is what the controller reads a node's
    # identity with (identity.go:captureNodeKey), and cp/mkdir/chmod are what the
    # restore-node-key initContainer puts it back with. Without them the stable
    # node ID mechanism does not work, and — before this was made loud — did not
    # work quietly: a rebalance then recreates the PVC, Garage generates a new
    # node ID, and the old one stays in the layout as a dead node.
    #
    # base/distroless does not carry it by default: base/vex in this same
    # repository installs coreutils explicitly for the same reason.
    - pm install -n --rootDir /relocate libc libgcc coreutils bash findutils
    - for d in /relocate/usr/bin /relocate/bin; do if [ -x "$d/bash" ] && [ ! -e "$d/sh" ]; then ln -s bash "$d/sh"; fi; done
    - mkdir -p /relocate/etc
    - if [ -x /relocate/sbin/ldconfig ]; then chroot /relocate /sbin/ldconfig; fi
    - ln -s usr/lib /relocate/lib64
    - chroot /relocate sh -c 'command -v find && command -v wc && command -v base64'
    - rm /relocate/lib64

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-runtime-artifact
    add: /relocate
    to: /
    before: setup
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
    add: /garage
    to: /garage
    before: setup
git:
{{- include "image mount points" . }}

imageSpec:
  config:
    entrypoint: ["/garage"]
    env:
      GARAGE_VERSION: "{{ $garageVersion }}"
