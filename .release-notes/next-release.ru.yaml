highlights: []

improvements:
  - "В DKP 1.78 и новее роли `d8:system-capability:system-s3:view` и `d8:system-capability:system-s3:edit` дают также доступ на чтение к ModuleConfig `system-s3`, а `edit` — и на запись, и несут стандартные заголовки и описания платформы, как все capability ролевой модели DKP 1.78. RBAC модуля теперь описан в `rbac.yaml`, и шаблоны RBACv2 пишутся из него; кластеры ниже DKP 1.78 сохраняют прежние роли."

docs:
  - "Настройка `storageClass` описана как StorageClass только для данных самого системного объектного хранилища, а не для остальных системных компонентов платформы: их класс по умолчанию задаётся `defaultClusterStorageClass` в ModuleConfig `global`."

