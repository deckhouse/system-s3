date: "2026-11-24"

summary: "Модуль снова устанавливается и обновляется и сохраняет свой CA при перезапуске Deckhouse, а его контроллер занимает меньше памяти и работает без kube-rbac-proxy."

highlights:
  - "Модуль снова устанавливается и обновляется: v0.1.2 падал на Secret `system-s3-ca` с ошибкой `illegal base64 data at input byte 0`, а CA модуля снова сохраняется при обновлении с v0.1.1 или v0.1.2 и при перезапуске Deckhouse."
  - "Контроллер отдаёт метрики без kube-rbac-proxy и в режиме высокой доступности (HA) работает в двух репликах, а не по одной на каждом мастере."

improvements:
  - "В DKP 1.78 и новее роли `d8:system-capability:system-s3:view` и `d8:system-capability:system-s3:edit` дают также доступ на чтение к ModuleConfig `system-s3`, а `edit` — и на запись, и несут стандартные заголовки и описания платформы, как все capability ролевой модели DKP 1.78. RBAC модуля теперь описан в `rbac.yaml`, и шаблоны RBACv2 пишутся из него; кластеры ниже DKP 1.78 сохраняют прежние роли."
  - "Контроллер сам проверяет токен при сборе метрик и больше не запускает контейнер kube-rbac-proxy. В режиме высокой доступности он работает в двух репликах, а не по одной на каждом мастере, и больше не хранит `managedFields` объектов в своём кеше, поэтому занимает меньше памяти."

fixes:
  - "Модуль снова устанавливается и обновляется. Начиная с v0.1.2 Secret `system-s3-ca` содержал в `data` PEM CA модуля вместо его base64, API-сервер отклонял его с ошибкой `illegal base64 data at input byte 0`, и релиз модуля не устанавливался. CA модуля также снова сохраняется: v0.1.2 не мог прочитать CA обратно из Secret `system-s3-ca` и выпускал новый при каждом запуске Deckhouse. Теперь модуль использует CA из этого Secret, поэтому обновление с v0.1.1 или v0.1.2 и перезапуск Deckhouse его не меняют, и клиенты, которые ему доверяют, продолжают доверять модулю. CA по-прежнему перевыпускается, когда до конца срока его действия остаётся меньше шести месяцев."
  - "Запись SystemBucket, не уложившаяся в отведённое время, теперь считается неудачной. Раньше такая запись могла считаться выполненной, и статус SystemBucket и модуля сообщал, что изменение применено, хотя это было не так."

docs:
  - "Настройка `storageClass` описана как StorageClass только для данных самого системного объектного хранилища, а не для остальных системных компонентов платформы: их класс по умолчанию задаётся `defaultClusterStorageClass` в ModuleConfig `global`."
