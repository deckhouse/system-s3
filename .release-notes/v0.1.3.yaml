date: "2026-11-24"

summary: "The module installs and updates again and keeps its CA across restarts of Deckhouse, and its controller runs with less memory and without a kube-rbac-proxy."

highlights:
  - "The module installs and updates again: v0.1.2 failed on the `system-s3-ca` Secret with `illegal base64 data at input byte 0`, and the module CA is kept again on an update from v0.1.1 or v0.1.2 and on a restart of Deckhouse."
  - "The controller serves its metrics without a kube-rbac-proxy and runs two replicas in HA mode instead of one per master."

improvements:
  - "On DKP 1.78 and later, the `d8:system-capability:system-s3:view` and `d8:system-capability:system-s3:edit` roles also give read access to the `system-s3` ModuleConfig, and `edit` write access to it, and carry the standard titles and descriptions of the platform, as every capability of the DKP 1.78 role model does. The RBAC of the module is now declared in `rbac.yaml`, and the RBACv2 templates are written from it; clusters below DKP 1.78 keep the roles they had."
  - "The controller checks the token of a metrics scrape itself and no longer runs a kube-rbac-proxy container. In HA mode it runs two replicas instead of one per master, and it no longer keeps the `managedFields` of the objects it caches, so it takes less memory."

fixes:
  - "The module installs and updates again. Since v0.1.2 the `system-s3-ca` Secret carried the PEM of the module CA in `data` instead of its base64, the API server refused it with `illegal base64 data at input byte 0`, and the module release failed to install. The module also keeps its CA again: v0.1.2 could not read the CA back from the `system-s3-ca` Secret and issued a new one on every start of Deckhouse. Now the CA in that Secret is the one the module uses, so an update from v0.1.1 or v0.1.2 and a restart of Deckhouse leave it as it was, and clients that trust it keep trusting the module. The CA is still renewed when less than six months of its validity are left."
  - "A SystemBucket write that ran out of its time limit is reported as failed. Before, such a write could be reported as done, and the status of the SystemBucket and the module said the change was applied while it was not."

docs:
  - "The `storageClass` setting is described as the StorageClass for the data of the system object storage only, not for the platform's other system components; their default is `defaultClusterStorageClass` in the `global` ModuleConfig."
