# The module RBAC declaration, read from the RBAC objects the module renders. Review it: every TODO is a
# decision "dmt lint" reports; then run "dmt lint --linter rbac --fix" to bring the templates in line with it.
# Objects rendered only under values other than the defaults are not here: lint with --values-file (or
# --matrix) before the first --fix of the templates if the module has such templates, and declare them with when.
#
# Not described by the declaration (stays hand-written, as it is):
# - ClusterRole/d8:system-s3:controller (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
# - ClusterRoleBinding/d8:system-s3:controller (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
# - ClusterRoleBinding/d8:system-s3:controller:rbac-proxy (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
# - d8-system-s3/Role/controller (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
# - d8-system-s3/RoleBinding/controller (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
# - d8-system-s3/ServiceAccount/controller (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
apiVersion: rbac.deckhouse.io/v1alpha1
resources:
  - group: storage.deckhouse.io
    resource: systembuckets
    reason: 'SystemBuckets are requested by other platform modules in their own namespaces; the storage subsystem oversees all of them, as the module granted before'
    system:
      manager:
        - create
        - delete
        - deletecollection
        - patch
        - update
      viewer:
        - get
        - list
        - watch
prometheusAccess:
  path: controller
  name: prometheus-metrics
  deployments:
    - controller
  when: (.Values.global.enabledModules | has "prometheus")
  labels:
    app: controller
