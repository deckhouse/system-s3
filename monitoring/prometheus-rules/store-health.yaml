- name: d8.system-s3.store-health
  rules:
    # The module publishes one series per store and only for a store that exists,
    # so a cluster without the module has nothing here and these rules stay
    # silent. None of them carries an absent() arm for that reason.

    - alert: D8SystemS3StoreNotReady
      # Ten minutes, because the honest causes of a short gap are ordinary: a
      # rolling restart of the data plane, a replica rescheduled onto another
      # node, a layout being assigned on a fresh installation. What is not
      # ordinary is a store that is still not serving after a coffee.
      expr: system_s3_store_ready == 0
      for: 10m
      labels:
        severity_level: "4"
        tier: cluster
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        summary: The system object storage is not serving.
        description: |
          The data plane of `{{ $labels.store }}` has not been ready for ten minutes.

          Every platform component holding a `SystemBucket` is affected: reads and writes to
          its bucket fail for as long as this lasts. The buckets themselves are not lost —
          this is a data plane that is down, not one that is gone.

          What it is waiting for is written on every `SystemBucket`, in full sentences:

          ```
          d8 k get systembucket -A -o custom-columns=\
          NS:.metadata.namespace,NAME:.metadata.name,\
          MESSAGE:'.status.conditions[?(@.type=="StorageReady")].message'
          ```

          The usual answers are a `StorageClass` that binds nothing, a volume that cannot be
          grown, and replicas that cannot schedule.

    - alert: D8SystemS3BucketAlmostFull
      # The quota is a hard ceiling in the backend: a bucket at it refuses writes,
      # and the component that owns it has no other warning. Thirty minutes so a
      # burst that drains itself does not page anyone.
      # Either quota: the bytes, or the object count (spec.size / 64 KiB), which a
      # bucket of small objects reaches with most of its bytes to spare.
      expr: |
        (
          system_s3_bucket_quota_bytes > 0
          and
          system_s3_bucket_used_bytes / system_s3_bucket_quota_bytes > 0.85
        )
        or
        (
          system_s3_bucket_quota_objects > 0
          and
          system_s3_bucket_objects / system_s3_bucket_quota_objects > 0.85
        )
      for: 30m
      labels:
        severity_level: "5"
        tier: cluster
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        summary: A system bucket is nearly full.
        description: |
          `{{ $labels.namespace }}/{{ $labels.name }}` is using more than 85% of its quota —
          of its bytes (`status.quotaBytes`) or of its object count (`status.quotaObjects`,
          `spec.size` / 64 KiB).

          At 100% the backend refuses writes. Nothing in the platform reclaims space here —
          a system bucket belongs to one component and only that component knows what in it
          can go.

          Raising the quota is one field, and the data plane's volumes follow it:

          ```
          d8 k -n {{ $labels.namespace }} patch systembucket {{ $labels.name }} \
            --type=merge -p '{"spec":{"size":"<new size>"}}'
          ```

          The volumes grow only if the `StorageClass` allows expansion; if it does not, the
          bucket's `StorageReady` condition says so.

    - alert: D8SystemS3BucketFull
      expr: |
        (
          system_s3_bucket_quota_bytes > 0
          and
          system_s3_bucket_used_bytes >= system_s3_bucket_quota_bytes
        )
        or
        (
          system_s3_bucket_quota_objects > 0
          and
          system_s3_bucket_objects >= system_s3_bucket_quota_objects
        )
      for: 5m
      labels:
        severity_level: "4"
        tier: cluster
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        summary: A system bucket is full and refusing writes.
        description: |
          `{{ $labels.namespace }}/{{ $labels.name }}` has reached its quota, and the backend
          is refusing writes to it with 403 `AccessDenied` — "Bucket size quota is reached"
          for the bytes, "Object quota is reached" for the object count
          (`spec.size` / 64 KiB).

          Whatever component owns this bucket is losing whatever it was trying to store.
          Raise `spec.size` on the `SystemBucket`, or free space in the bucket.

    - alert: D8SystemS3ReplicaNotReady
      # The store serves, so D8SystemS3StoreNotReady is silent, and a replica of
      # it is not ready: the store has less redundancy than it is built with,
      # and the next replica lost — a drain, a node reboot — may stop it.
      #
      # Only the serving plane: the plane a migration is filling has replicas that
      # are not ready by design for a while, and its progress is the migration's
      # alerts' business. Fifteen minutes, because a replica restarting, or
      # rescheduled with its volume, is back well within that.
      #
      # The controller's series carry no namespace (the scrape drops it), and the
      # platform passes on alerts of tier: cluster only for its own namespaces, so
      # the module's namespace is put on the result.
      expr: |
        label_replace(
          system_s3_replica_ready{serving="true"} == 0
          and on ()
          max(system_s3_store_ready) == 1,
          "namespace", "d8-system-s3", "", ""
        )
      for: 15m
      labels:
        severity_level: "5"
        tier: cluster
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        plk_labels_as_annotations: "replica,node"
        summary: A replica of the system object storage is not ready while the store serves.
        description: |
          `{{ $labels.replica }}` (node `{{ $labels.node }}`, empty while it is not scheduled) has
          not been `Ready` for fifteen minutes. The store still serves, with one replica less
          than it is built with: another one away can cost it the quorum.

          The module's `StorageReady` condition names the replica, and its pod says why:

          ```
          d8 k get module system-s3 -o jsonpath='{.status.conditions[?(@.type=="StorageReady")].message}{"\n"}'
          d8 k -n d8-system-s3 describe pod {{ $labels.replica }}
          d8 k -n d8-system-s3 logs {{ $labels.replica }} -c garage --tail=100
          ```

          A pod that is `Pending` has no eligible node or a volume that cannot attach where it
          is pinned (see `PlacementReady`); one that is running and not ready is not in the
          Garage layout or cannot reach its peers on port 3901. Do not drain another node of
          the data plane until this is resolved.

    - alert: D8SystemS3PlacementBlocked
      # PlacementReady=False with reason PlacementBlocked: the controller wants to
      # move or place a replica and cannot — no eligible node left, or a node
      # identity it cannot reuse. It says so on Module/system-s3 and nowhere else,
      # and the store may well serve in the meantime, so nothing else notices.
      #
      # Thirty minutes: a node coming back from a reboot or a drain unblocks it on
      # its own well before that.
      expr: |
        label_replace(
          system_s3_condition{type="PlacementReady", status="False", reason="PlacementBlocked"} == 1,
          "namespace", "d8-system-s3", "", ""
        )
      for: 30m
      labels:
        severity_level: "5"
        tier: cluster
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        summary: The system object storage cannot place its replicas.
        description: |
          `Module/system-s3` has reported `PlacementReady=False`, reason `PlacementBlocked`, for
          half an hour: a replica of the data plane has no node it is allowed to run on, so the
          store runs with fewer replicas than it is built with, or a replica waits to move.

          The condition's message names the replica and the nodes it considered:

          ```
          d8 k get module system-s3 -o jsonpath='{.status.conditions[?(@.type=="PlacementReady")].message}{"\n"}'
          ```

          The usual causes are fewer eligible nodes than replicas (the module's node placement
          settings, the `system-s3` node role, taints), and a node-pinned volume whose node is
          gone. Add or label nodes, or relax the placement settings; do not delete the volume
          claims of the replicas, they hold the data.
